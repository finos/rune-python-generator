[pytest]
# A generated annotation that resolves to an object instead of a type leaves its field
# unvalidated (#331). Fail the test run instead of only warning. Matched by message, since
# pydantic.warnings.ArbitraryTypeWarning doesn't exist in every supported pydantic version.
filterwarnings =
    error:.*is not a Python type \(it may be an instance of an object\):UserWarning
